name: Generate Blog and Deploy

on:
  schedule:
    - cron: '0 16 * * *'   # 9AM PST daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  blog-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      # Ensure posts directory exists
      - name: Create posts directory
        run: mkdir -p src/app/blog/posts

      # Debug: Check current structure
      - name: Debug - Check blog structure
        run: |
          echo "=== Current directory structure ==="
          pwd
          echo "=== Blog directory ==="
          ls -la src/app/blog/ || echo "No blog directory"
          echo "=== Posts directory ==="
          ls -la src/app/blog/posts/ || echo "No posts directory"

      # Only generate blog on schedule or manual trigger
      - name: Generate Blog Post
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node blog-agent/index.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_ACTIONS: true

      # Debug: Check after generation
      - name: Debug - List all blog files
        run: |
          echo "=== All MDX files ==="
          find . -name "*.mdx" -type f | head -20 || echo "No MDX files found"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      - name: Commit blog changes
        if: steps.check_changes.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "🤖 Daily blog post: $(date +'%Y-%m-%d %H:%M:%S')"

      # Build Next.js site
      - name: Build Next.js site
        run: |
          echo "=== Building Next.js site ==="
          npm run build
          echo "=== Build complete ==="
          echo "=== Checking for output directories ==="
          ls -la
          if [ -d "out" ]; then
            echo "✅ 'out' directory exists"
            ls -la out/
          elif [ -d ".next" ]; then
            echo "ℹ️ '.next' directory exists (need to export)"
            ls -la .next/
          else
            echo "❌ No build output found!"
            exit 1
          fi
        env:
          NODE_ENV: production
          # FIXED: Use vars instead of secrets for environment variables
          NEXT_PUBLIC_GTAG_ID: ${{ vars.NEXT_PUBLIC_GTAG_ID }}

      # Export if needed (for Next.js 13)
      - name: Export static site (if needed)
        run: |
          if [ ! -d "out" ] && [ -d ".next" ]; then
            echo "=== Exporting static site ==="
            npx next export -o out || echo "Export command failed, trying alternative"
          fi
          
          # Check if out directory exists now
          if [ ! -d "out" ]; then
            echo "❌ ERROR: 'out' directory still doesn't exist!"
            echo "=== Current directory contents ==="
            ls -la
            exit 1
          fi

      # Debug: Check build output
      - name: Debug - Check build output
        run: |
          echo "=== Output directory structure ==="
          if [ -d "out" ]; then
            find out -type f -name "*.html" | head -20
            echo "=== Blog directory in output ==="
            ls -la out/blog/ || echo "No blog directory in output"
          fi

      - name: Add deployment files
        run: |
          if [ -d "out" ]; then
            touch out/.nojekyll
            echo 'crmco.us' > out/CNAME
            cp out/index.html out/404.html || echo "Warning: No index.html to copy"
          else
            echo "ERROR: 'out' directory not found!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true

      # Push blog changes after deployment
      - name: Push blog changes
        if: steps.check_changes.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: git push origin main
        