# .github/workflows/generate-blog.yml
name: Generate Daily Blog Post

on:
  schedule:
    - cron: '0 16 * * *'  # 9AM PST
  workflow_dispatch:

jobs:
  blog-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Blog
        run: node blog-agent/index.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}

      - name: Check if new files exist
        run: |
          echo "Files in blog directory:"
          find src/app/blog/ -type f -name "*.mdx" || echo "No MDX files found"

      - name: Commit and push new blog
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add all changes
          git add -A
          
          # Check if there are any changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily blog post: $(date +'%Y-%m-%d')"
            git push origin main
            echo "Successfully committed and pushed changes"
          fi